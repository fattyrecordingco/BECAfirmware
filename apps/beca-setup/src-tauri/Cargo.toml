[package]
name = "beca-setup"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "BECA one-click setup app"

[[bin]]
name = "beca-setup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
anyhow = "1.0"
beca-bridge = { path = "../../../tools/bridge" }
beca-flasher = { path = "../../../tools/flasher" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.2", features = [] }
tokio = { version = "1.43", features = ["macros", "process", "rt-multi-thread", "io-util", "fs"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
