[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
lib_ldf_mode = deep+
build_src_filter =
    +<*>
    -<ableton/>
    -<apps/>
    -<dist/>
    -<docs/>
    -<target/>
    -<tools/>
    -<test/>
build_flags =
    -DARDUINO_DISABLE_AUTOPROTOTYPE
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DNDEBUG
platform_packages =
    platformio/framework-arduinoespressif32@3.20014.231204
lib_deps =
    lathoub/BLE-MIDI@2.2
    fortyseveneffects/MIDI Library@5.0.2
    h2zero/NimBLE-Arduino@1.4.3
    fastled/FastLED@3.10.3
