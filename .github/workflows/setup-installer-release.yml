name: Build Setup Installer

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-installers:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'setup-v')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/beca-setup/package.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps for Tauri
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libudev-dev \
            patchelf

      - name: Install JS dependencies
        working-directory: apps/beca-setup
        run: npm install

      - name: Build flasher sidecar
        run: cargo build -p beca-flasher --release -vv

      - name: Build bridge sidecar
        run: cargo build -p beca-bridge --release -vv

      - name: Install espflash sidecar
        run: cargo install espflash --locked --version 4.2.0

      - name: Copy sidecars (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target\release\beca-bridge.exe apps\beca-setup\src-tauri\binaries\beca-bridge.exe -Force
          Copy-Item target\release\beca-flasher.exe apps\beca-setup\src-tauri\binaries\beca-flasher.exe -Force
          Copy-Item $env:USERPROFILE\.cargo\bin\espflash.exe apps\beca-setup\src-tauri\binaries\espflash.exe -Force

      - name: Copy sidecars (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          cp target/release/beca-bridge apps/beca-setup/src-tauri/binaries/beca-bridge
          cp target/release/beca-flasher apps/beca-setup/src-tauri/binaries/beca-flasher
          cp ~/.cargo/bin/espflash apps/beca-setup/src-tauri/binaries/espflash
          chmod +x apps/beca-setup/src-tauri/binaries/beca-bridge
          chmod +x apps/beca-setup/src-tauri/binaries/beca-flasher
          chmod +x apps/beca-setup/src-tauri/binaries/espflash

      - name: Build Tauri bundle
        working-directory: apps/beca-setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beca-setup-${{ matrix.os }}
          path: target/release/bundle/**
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb

  sync-installer-mirror:
    needs: build-installers
    if: always() && needs.build-installers.result != 'cancelled' && github.repository == 'fattyrecordingco/BECAfirmware'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download installer artifacts from this run
        uses: actions/download-artifact@v4
        with:
          pattern: beca-setup-*
          merge-multiple: true
          path: ${{ runner.temp }}/beca-setup-artifacts

      - name: Sync cross-platform installer mirror
        shell: bash
        run: |
          set -euo pipefail

          artifact_root="${RUNNER_TEMP}/beca-setup-artifacts"
          mirror_root="${GITHUB_WORKSPACE}/apps/beca-setup/dist-installer"

          rm -rf "${mirror_root}/windows" "${mirror_root}/macos" "${mirror_root}/linux"
          mkdir -p "${mirror_root}/windows" "${mirror_root}/macos" "${mirror_root}/linux"
          touch "${mirror_root}/windows/.gitkeep" "${mirror_root}/macos/.gitkeep" "${mirror_root}/linux/.gitkeep"

          windows_count=0
          macos_count=0
          linux_count=0

          while IFS= read -r -d '' file; do
            lower="$(echo "${file}" | tr '[:upper:]' '[:lower:]')"
            case "${lower}" in
              *.dmg)
                cp "${file}" "${mirror_root}/macos/"
                macos_count=$((macos_count+1))
                ;;
              *.appimage|*.deb)
                cp "${file}" "${mirror_root}/linux/"
                linux_count=$((linux_count+1))
                ;;
              *.exe|*.msi|*.zip|*webview2loader.dll)
                cp "${file}" "${mirror_root}/windows/"
                windows_count=$((windows_count+1))
                ;;
            esac
          done < <(find "${artifact_root}" -type f -print0)

          total=$((windows_count+macos_count+linux_count))
          echo "Installer files copied -> windows:${windows_count} macos:${macos_count} linux:${linux_count}"
          if [ "${total}" -eq 0 ]; then
            echo "No installer files were available in workflow artifacts."
            exit 1
          fi

      - name: Commit installer mirror updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- apps/beca-setup/dist-installer; then
            echo "No installer mirror changes."
            exit 0
          fi

          git add -A -f apps/beca-setup/dist-installer
          git commit -m "chore(setup): sync installer mirror (windows/macos/linux)"
          git push origin HEAD:master
