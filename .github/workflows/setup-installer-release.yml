name: Build Setup Installer

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform build selection
        type: choice
        options: [all, windows, macos-arm64]
        default: all
      firmware_run:
        description: Optional successful firmware run to reuse for an installer retry
        required: false
        type: string
  push:
    tags:
      - "setup-v*"
      - "apps-v*"

permissions:
  contents: write
  actions: read

jobs:
  firmware:
    if: ${{ !inputs.firmware_run }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare pinned firmware tools
        run: python -m pip install platformio==6.2.0 esptool==5.2.0 Markdown==3.8.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated UI and manual
        run: |
          node apps/beca-phone/scripts/build.mjs
          python tools/build_device_player.py
          python tools/check_ui_copy.py
          python make_index_header.py
          python tools/release/render_manual.py
          git diff --exit-code -- device_player.h index_html.h docs/user/BECA_MANUAL.html apps/beca-setup/ui/public/manual.html
      - name: Test audio and compile core 2.0.14 firmware
        run: |
          g++ -std=c++17 -Itests/audio/stubs -I. tests/audio/audio_test.cpp drum_engine.cpp dsp_blocks.cpp -o /tmp/beca-audio-test
          /tmp/beca-audio-test
          python -m platformio run -e esp32dev
          python tools/release/prepare_release.py --version 1.2.1 --tag "${{ startsWith(github.ref, 'refs/tags/apps-v') && github.ref_name || 'apps-v0.3.1' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: beca-firmware
          path: dist/firmware-release/*
          if-no-files-found: error

  build-installers:
    needs: firmware
    if: |
      always() && (needs.firmware.result == 'success' ||
        (needs.firmware.result == 'skipped' && inputs.firmware_run != ''))
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'windows' && '["windows-latest"]' || inputs.platform == 'macos-arm64' && '["macos-15"]' || '["windows-latest","macos-15","macos-15-intel","ubuntu-22.04"]') }}

    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      BECA_SIGNED_RELEASE: ${{ vars.BECA_SIGNED_RELEASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/beca-setup/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: beca-firmware
          path: apps/beca-setup/src-tauri/resources/firmware
          run-id: ${{ inputs.firmware_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage included firmware
        shell: bash
        run: mv apps/beca-setup/src-tauri/resources/firmware/beca-1.2.1-merged.bin apps/beca-setup/src-tauri/resources/firmware/beca-merged.bin

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Report Windows signing mode
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:BECA_SIGNED_RELEASE -ne "true") {
            "### Windows signing" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "BECA_SIGNED_RELEASE is not true. This run will publish unsigned beta installers." >> $env:GITHUB_STEP_SUMMARY
          } elseif ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            "### Windows signing" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "WINDOWS_CERTIFICATE secrets are not configured. This run will publish unsigned beta installers." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Windows signing certificate detected. Installers will be signed after bundling." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Report macOS signing mode
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ "${BECA_SIGNED_RELEASE:-}" != "true" ]; then
            missing=1
          else
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -z "${!name:-}" ]; then
                missing=1
              fi
            done
          fi
          {
            echo "### macOS signing"
            echo
            if [ "${BECA_SIGNED_RELEASE:-}" != "true" ]; then
              echo "BECA_SIGNED_RELEASE is not true. This run will publish unsigned beta installers."
            elif [ "${missing}" -eq 1 ]; then
              echo "Apple Developer ID/notarization secrets are incomplete. This run will publish unsigned beta installers."
            else
              echo "Apple signing and notarization secrets detected."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install Linux app dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libudev-dev \
            librsvg2-dev \
            patchelf

      - name: Configure macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ "${BECA_SIGNED_RELEASE:-}" != "true" ]; then
            missing=1
          else
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -z "${!name:-}" ]; then
                missing=1
              fi
            done
          fi
          if [ "${missing}" -eq 1 ]; then
            echo "Skipping macOS signing/notarization for unsigned beta build."
            echo "APPLE_SIGNING_IDENTITY=-" >> "${GITHUB_ENV}"
            echo "APPLE_CERTIFICATE=" >> "${GITHUB_ENV}"
            echo "APPLE_CERTIFICATE_PASSWORD=" >> "${GITHUB_ENV}"
            echo "APPLE_ID=" >> "${GITHUB_ENV}"
            echo "APPLE_PASSWORD=" >> "${GITHUB_ENV}"
            echo "APPLE_TEAM_ID=" >> "${GITHUB_ENV}"
            exit 0
          fi
          echo "${APPLE_CERTIFICATE}" | base64 --decode > certificate.p12
          security create-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" build.keychain
          CERT_INFO="$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n 1)"
          CERT_ID="$(echo "${CERT_INFO}" | awk -F'"' '{print $2}')"
          if [ -z "${CERT_ID}" ]; then
            echo "Developer ID Application identity not found."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=${CERT_ID}" >> "${GITHUB_ENV}"

      - name: Install JS dependencies
        working-directory: apps/beca-setup
        run: npm ci

      - name: Test bridge, flasher and application
        run: cargo test --workspace --release --locked

      - name: Browser and recovery regressions
        if: runner.os == 'Windows'
        working-directory: apps/beca-setup
        run: |
          npx playwright install chromium
          npm test
          npm run test:ui

      - name: Build flasher sidecar
        run: cargo build -p beca-flasher --release -vv

      - name: Build bridge sidecar (Windows)
        if: runner.os == 'Windows'
        run: cargo build -p beca-bridge --release -vv

      - name: Build bridge sidecar (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          if cargo build -p beca-bridge --release -vv 2>&1 | tee "$log_file"; then
            exit 0
          fi
          echo "First beca-bridge build failed, retrying once..."
          sleep 5
          if cargo build -p beca-bridge --release -vv 2>&1 | tee -a "$log_file"; then
            exit 0
          fi
          tail_file="$(mktemp)"
          tail -n 120 "$log_file" > "$tail_file" || true
          escaped_tail="$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g' "$tail_file")"
          echo "::error title=beca-bridge build failed::${escaped_tail}"
          {
            echo "### beca-bridge build failure"
            echo
            echo '```text'
            cat "$tail_file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          exit 1

      - name: Install espflash sidecar
        run: cargo install espflash --locked --version 4.2.0

      - name: Download esptool sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "5.2.0"
          $zip = Join-Path $env:RUNNER_TEMP "esptool-v$version-windows-amd64.zip"
          $extract = Join-Path $env:RUNNER_TEMP "esptool-v$version-windows-amd64"
          Invoke-WebRequest -Uri "https://github.com/espressif/esptool/releases/download/v$version/esptool-v$version-windows-amd64.zip" -OutFile $zip
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $exe = Get-ChildItem $extract -Recurse -Filter "esptool.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "esptool.exe not found in downloaded archive." }
          Copy-Item $exe "$env:RUNNER_TEMP\\esptool.exe" -Force

      - name: Copy sidecars (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target\release\beca-bridge.exe apps\beca-setup\src-tauri\binaries\beca-bridge.exe -Force
          Copy-Item target\release\beca-flasher.exe apps\beca-setup\src-tauri\binaries\beca-flasher.exe -Force
          Copy-Item $env:USERPROFILE\.cargo\bin\espflash.exe apps\beca-setup\src-tauri\binaries\espflash.exe -Force
          Copy-Item $env:RUNNER_TEMP\esptool.exe apps\beca-setup\src-tauri\binaries\esptool.exe -Force

      - name: Copy sidecars (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          cp target/release/beca-bridge apps/beca-setup/src-tauri/binaries/beca-bridge
          cp target/release/beca-flasher apps/beca-setup/src-tauri/binaries/beca-flasher
          cp ~/.cargo/bin/espflash apps/beca-setup/src-tauri/binaries/espflash
          chmod +x apps/beca-setup/src-tauri/binaries/beca-bridge
          chmod +x apps/beca-setup/src-tauri/binaries/beca-flasher
          chmod +x apps/beca-setup/src-tauri/binaries/espflash

      - name: Build Tauri bundle (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/beca-setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run tauri build

      - name: Build Tauri bundle (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: apps/beca-setup
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${BECA_SIGNED_RELEASE:-}" != "true" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD
            export APPLE_SIGNING_IDENTITY="-"
          fi
          log_file="$(mktemp)"
          if npm run tauri build 2>&1 | tee "${log_file}"; then
            exit 0
          fi
          tail_file="$(mktemp)"
          grep -Ei '(^error|error:|failed|failure|panicked|caused by|not found|no such file|exit status|could not)' "${log_file}" | tail -n 40 > "${tail_file}" || true
          if [ ! -s "${tail_file}" ]; then
            tail -n 40 "${log_file}" > "${tail_file}" || true
          fi
          escaped_tail="$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g' "${tail_file}")"
          echo "::error title=Tauri bundle failed::${escaped_tail}"
          {
            echo "### Tauri bundle failure"
            echo
            echo '```text'
            cat "${tail_file}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}" || true
          exit 1

      - name: Sign Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:BECA_SIGNED_RELEASE -ne "true" -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            Write-Host "Skipping Windows signing for unsigned beta build."
            exit 0
          }
          New-Item -ItemType Directory -Force certificate | Out-Null
          Set-Content -Path certificate\certificate.base64 -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate\certificate.base64 certificate\certificate.pfx
          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          Import-PfxCertificate -FilePath certificate\certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found. Install Windows SDK on the runner." }
          $files = Get-ChildItem target\release\bundle -Recurse -Include *.exe,*.msi
          foreach ($file in $files) {
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /a $file.FullName
            & $signtool verify /pa /v $file.FullName
          }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beca-setup-${{ matrix.os }}
          path: target/release/bundle/**
          if-no-files-found: error


  phone-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/beca-phone/package-lock.json
      - working-directory: apps/beca-phone
        run: |
          npm ci
          npx playwright install --with-deps chrome webkit
          npm test
          npm run test:ui -- --retries=1
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: beca-phone-release
          path: apps/beca-phone/dist/
          include-hidden-files: true

  apple-device:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node apps/beca-apple/prepare.mjs
      - name: Verify native MIDI and address handling
        run: |
          swiftc apps/beca-apple/BECAApple/MIDIStream.swift apps/beca-apple/tests/main.swift -o "$RUNNER_TEMP/midi-test"
          "$RUNNER_TEMP/midi-test"
          python3 tools/verify_apple_address.py
      - name: Build iPhone, iPad and Mac
        run: |
          xcodebuild -project apps/beca-apple/BECAApple.xcodeproj -scheme BECAApple -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/apple-device CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project apps/beca-apple/BECAApple.xcodeproj -scheme BECAApple -destination 'generic/platform=macOS' -derivedDataPath build/apple-mac ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
          python3 apps/beca-apple/verify-bundle.py build/apple-device/Build/Products/Release-iphoneos/BECAApple.app
          mkdir -p build/apple-handoff/Payload
          ditto build/apple-device/Build/Products/Release-iphoneos/BECAApple.app build/apple-handoff/Payload/BECAApple.app
          cd build/apple-handoff
          zip -qr BECA-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: beca-apple-release
          path: build/apple-handoff/BECA-unsigned.ipa

  publish:
    if: startsWith(github.ref, 'refs/tags/apps-v')
    needs: [firmware, build-installers, phone-checks, apple-device]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: beca-setup-*
          path: dist/installers
      - uses: actions/download-artifact@v4
        with:
          name: beca-firmware
          path: dist/firmware-release
      - uses: actions/download-artifact@v4
        with:
          name: beca-phone-release
          path: apps/beca-phone/dist
      - uses: actions/download-artifact@v4
        with:
          name: beca-apple-release
          path: dist/apple
      - name: Validate and stage all platforms
        run: python3 tools/release/stage_assets.py --desktop-version 0.3.1 --phone-version 1.7.1 --firmware-version 1.2.1 --tag "$GITHUB_REF_NAME" --phone-url https://fattyrecordingco.github.io/BECAfirmware/ --mac-zip
      - name: Publish checked downloads and notify release subscribers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published downloads.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/publish/* --verify-tag --latest --title "BECA 0.3.1 — MIDI Learn" --notes-file docs/releases/apps-v0.3.1.md
