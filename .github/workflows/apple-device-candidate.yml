name: Apple device candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node apps/beca-apple/prepare.mjs
      - run: python3 tools/verify_apple_address.py
      - name: Build unsigned iPhone and iPad candidate
        run: xcodebuild -project apps/beca-apple/BECAApple.xcodeproj -scheme BECAApple -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/apple-device CODE_SIGNING_ALLOWED=NO build
      - name: Verify and package
        run: |
          python3 apps/beca-apple/verify-bundle.py build/apple-device/Build/Products/Release-iphoneos/BECAApple.app
          mkdir -p build/apple-handoff/Payload
          ditto build/apple-device/Build/Products/Release-iphoneos/BECAApple.app build/apple-handoff/Payload/BECAApple.app
          printf '%s\n' "$GITHUB_SHA" > build/apple-handoff/commit.txt
          cd build/apple-handoff
          zip -qr BECAApple-unsigned.ipa Payload
          shasum -a 256 BECAApple-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BECAApple-device-candidate-${{ github.sha }}
          path: |
            build/apple-handoff/BECAApple-unsigned.ipa
            build/apple-handoff/SHA256SUMS.txt
            build/apple-handoff/commit.txt
          if-no-files-found: error
